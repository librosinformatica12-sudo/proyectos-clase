<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sim Forest</title>
    <link rel="stylesheet" href="estilos.css">
    <script src="script/script.js" defer></script></head>
<body>
    <!--
      ÍNDICE RÁPIDO (Ctrl+F):
        CABECERA
        PANEL SIMULADOR
        TABLERO
        BARRA DE CONTROL
        PANEL ESTADISTICAS
        PANEL CONFIGURADOR
        CONTROLES DEL BOSQUE
        PROBABILIDADES
    -->

    <!-- ===== CABECERA ===== -->
    <div id="cabezera">
        <div id="Bienvenidos">

            <h1>Sim Forest</h1>
            <p>Bienvenidos a Sim Forest</p>

        </div>

        <!-- ===== PANEL SIMULADOR ===== -->
        <div id="panel-simulador">
            <!-- TABLERO: aquí JavaScript crea la tabla del bosque. -->
            <div id="tablero">
                
            </div>

            <!-- BARRA DE CONTROL: botones de avance, pausa y velocidad. -->
            <div id="barra_control">
                <button id="btn-avanzar1" title="Avanzar 1 iteracion">Avanzar</button>
                <button id="btn-atrasar" title="Mas lento">&#9664;</button>
                <button id="btn-parar" title="Pausa">&#9632;</button>
                <button id="btn-seguir" title="Play">&#9658;</button>
                <button id="btn-adelantar" title="Mas rapido">&#9193;</button>
            </div>

            <!-- PANEL ESTADISTICAS: JavaScript escribe aquí los contadores. -->
            <div id="panel_estadisticas">

            </div>
        </div>
        
    </div>

    <!-- ===== PANEL CONFIGURADOR ===== -->
    <div id="panel-configurador">
        <h2>Configuracion</h2>

        <!-- ===== CONTROLES DEL BOSQUE ===== -->
        <!-- M = número de columnas; N = número de filas. -->
        <span>Anchura del bosque M:</span>
        <div> 
            <input type="number" id="spin_anchura_bosque" min="1" max="30" value="5"
            placeholder="M (Anchura del bosque)">
        </div>
        <br>
        <span>Altura del bosque N:</span>
        <div>
            <input type="number" id="spin_altura_bosque" min="1" max="30" value="5"
            placeholder="N (Altura del bosque)">
        </div>
        <br>
        <!-- ===== PROBABILIDADES ===== -->
        <!-- P = probabilidad de que nazca un árbol; Q = probabilidad de incendio. -->
        <span>Probabilidad de nacimiento de árbol</span>
        <div>
            <input type="number" id="spin_probabilidad_arbol" min="0" max="1" step="0.01" value="0.5"
            placeholder="P (Probabilidad crear arbol)">
        </div>
        <br>
        <span>Probabilidad incendio</span>
        <div>
            <input type="number" id="spin_probabilidad_incendio" min="0" max="1" step="0.01" value="0.5"
            placeholder="Q (Probabilidad incendio)">
        </div>

        <button id="btn_tabla">Iniciar</button>

    </div>

</body>
</html>
